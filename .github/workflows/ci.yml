# Esteira do front: chama o workflow reutilizável do infra-base (docs/workflows.md).
#   - pull_request: "Validado localmente", tsc, eslint, prettier, fronteiras,
#     client gerado em dia, jest e expo export -p web.
#   - push na main: as mesmas verificações e deploy em dev no Amplify Hosting.
# O app do Amplify é a stack gestor-gastos-dev-web do infra-base, que publica o
# id em /gestor-gastos/dev/frontend/amplify-app-id (lido pelo workflow).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  esteira:
    uses: Rossete-Inc/gestor-gastos-infra-base/.github/workflows/frontend.yml@main
    permissions:
      contents: read
      id-token: write # OIDC na AWS, só no deploy
    with:
      verificacoes-extras: |
        npm run api:gerar
        git diff --exit-code src/shared/api/generated
      # Publicados pelas stacks auth e api do infra-base (infra/README.md).
      env-ssm: |
        EXPO_PUBLIC_API_URL=/gestor-gastos/{env}/api/url
        EXPO_PUBLIC_COGNITO_CLIENT_ID=/gestor-gastos/{env}/auth/user-pool-client-id
        EXPO_PUBLIC_COGNITO_USER_POOL_ID=/gestor-gastos/{env}/auth/user-pool-id
      # PWA (tarefa 11.1): service worker gerado sobre o dist de cada export e
      # smoke test do manifest, do sw.js e do rewrite em dev.
      # E2E (tarefa 12.1): Playwright contra o site de dev, depois do smoke.
      pos-export: npm run pwa:sw -- "$DIST_DIR"
      smoke-test: bash scripts/smoke-pwa.sh && bash scripts/e2e.sh
